name: deploy

# 只做两件事：构建前端 → 把 dist 发到服务器并重启后端
#
# 为什么工作流里不搬镜像：
#   Runner 在海外、服务器在国内，跨境搬 490MB 镜像既慢又容易超时；
#   而腾讯云 CVM 预置了内网 Docker Hub 镜像源（mirror.ccs.tencentyun.com），
#   服务器自己 docker pull 走内网、免公网流量。所以镜像交给服务器拉，
#   工作流只负责构建前端 + 同步 compose + 触发部署。
#
# 远端执行方式：逻辑全在 deploy/scripts/remote-deploy.sh，scp 上传后 ssh 只发一行命令。
# （不要把长脚本内联在 ssh-action 的 script 里：drone-ssh 传输时会破坏内容，
#   heredoc 缩进被剥、长脚本静默截断，都实测踩过。）
#
# 需要的仓库 Secret / Variable：
#   SSH_HOST   服务器地址
#   SSH_USER   登录用户（需 docker 权限）
#   SSH_KEY    SSH 私钥全文（含 BEGIN/END 行）
#   SSH_PORT   可选，默认 22
#   Variable: VITE_MAIL_HOST  登录页展示的邮件主机名，如 mail.kamisato.top

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  STALWART_TAG: v1
  APP_DIR: /opt/khavit
  SITE_INDEX_DIR: /opt/1panel/www/sites/khavit.kamisato.top/index

jobs:
  # ---------------------------------------------------------------- 1. 构建
  build:
    name: 1/2 构建前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（vue-tsc 类型检查 + vite build）
        run: npm run build
        env:
          VITE_MAIL_HOST: ${{ vars.VITE_MAIL_HOST }}

      - name: 校验产物
        run: |
          test -f dist/index.html
          grep -q '/assets/' dist/index.html

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ------------------------------------------------------------ 2. 部署
  deploy:
    name: 2/2 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 打包前端产物
        run: |
          set -euo pipefail
          mkdir -p .deploy
          tar -czf .deploy/dist.tar.gz -C frontend dist
          ls -lh .deploy/dist.tar.gz

      - name: 上传产物、compose 与部署脚本
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: '.deploy/dist.tar.gz,docker-compose.yml,docker-compose.server.yml,deploy/scripts/remote-deploy.sh'
          target: /tmp/khavit-upload
          rm: true
          overwrite: true
          timeout: 180s

      - name: 执行远端部署脚本
        uses: appleboy/ssh-action@v1.2.0
        env:
          STALWART_TAG: ${{ env.STALWART_TAG }}
          APP_DIR: ${{ env.APP_DIR }}
          SITE_INDEX_DIR: ${{ env.SITE_INDEX_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: STALWART_TAG,APP_DIR,SITE_INDEX_DIR
          script_stop: true
          command_timeout: 20m
          # 只发两行命令：真实逻辑在服务器磁盘上的 remote-deploy.sh 里执行。
          # tr -d '\r' 是保险：万一脚本被 Windows 行尾污染，先清一遍再跑。
          script: |
            tr -d '\r' < /tmp/khavit-upload/deploy/scripts/remote-deploy.sh > /tmp/khavit-remote-deploy.sh
            bash /tmp/khavit-remote-deploy.sh
