# 自建邮局 —— Stalwart 反向代理公共片段
# 放置：/etc/nginx/snippets/stalwart-proxy.conf
# 被 sites-available/mail.example.com.conf 里的 /jmap、/autoconfig 等 location 引用

# Host 必须写成 Stalwart 自己认定的主机名（与向导里的 server hostname 一致）
proxy_set_header Host              mail.example.com;
proxy_set_header X-Real-IP         $remote_addr;
# Stalwart 开了 clientIpSource=xForwardedFor 后按 forwardedHops 从右往左取地址，
# 所以两种写法都能拿到真实客户端，区别只在「前置层数」：
#   覆盖（本片段）：$remote_addr —— 单层反代，头里只有一项，最直观。
#   追加：$proxy_add_x_forwarded_for —— 客户端伪造的值被追加在左侧，最右一项仍是
#        $remote_addr，hops=1 时取到的是真实地址，伪造项被忽略（1Panel 面板生成的
#        反代默认就是这个写法，配 hops=1 是安全的，不必去改面板）。
# 前提始终是：Stalwart 的 443 只能经代理访问（本项目只绑 127.0.0.1），否则客户端
# 直连时可以自己造一个只带伪造值的头。
# 将来在前面再加 CDN：改用 $proxy_add_x_forwarded_for，并把 forwardedHops 设为 2。
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# HTTPS 后端：SNI 与证书校验名需显式给出
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name mail.example.com;
# Stalwart 若使用自签证书，保持 off；若与之共享同一份 Let's Encrypt 证书，可改为 on
proxy_ssl_verify off;

# JMAP 是批量往返协议，关闭缓冲可降低读信延迟；上传大附件走 PUT 流式转发
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# JMAP over WebSocket（可选，前端未启用也不影响）
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
