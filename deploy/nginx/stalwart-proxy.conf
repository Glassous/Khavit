# 自建邮局 —— Stalwart 反向代理公共片段
# 放置：/etc/nginx/snippets/stalwart-proxy.conf
# 被 sites-available/mail.example.com.conf 里的 /jmap、/autoconfig 等 location 引用

# Host 必须写成 Stalwart 自己认定的主机名（与向导里的 server hostname 一致）
proxy_set_header Host              mail.example.com;
proxy_set_header X-Real-IP         $remote_addr;
# 这里必须「覆盖」而不是追加：Stalwart 开启 clientIpSource=xForwardedFor 后会信任该头，
# 若用 $proxy_add_x_forwarded_for 就会把客户端自带的 X-Forwarded-For 一并透传，
# 攻击者可以伪造成任意地址，甚至把别人的 IP 送进 auto-ban 封禁名单。
# 本拓扑只有一层反代（Nginx → Stalwart），$remote_addr 就是真实客户端地址。
# 若将来在前面再加 CDN，改成 $proxy_add_x_forwarded_for 并把 forwardedHops 设为 2。
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# HTTPS 后端：SNI 与证书校验名需显式给出
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name mail.example.com;
# Stalwart 若使用自签证书，保持 off；若与之共享同一份 Let's Encrypt 证书，可改为 on
proxy_ssl_verify off;

# JMAP 是批量往返协议，关闭缓冲可降低读信延迟；上传大附件走 PUT 流式转发
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# JMAP over WebSocket（可选，前端未启用也不影响）
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
