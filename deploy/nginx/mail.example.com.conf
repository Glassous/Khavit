# 自建邮局 —— 宿主机 Nginx 站点配置
# 放置：/etc/nginx/sites-available/mail.example.com.conf，再软链到 sites-enabled/
# 把 mail.example.com / /var/www/mail 替换成你自己的域名与前端产物目录

# ---------- 80：只做 ACME 校验与跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：前端静态托管 + JMAP 反代 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.example.com;

    # 证书：certbot 签发（HTTP-01）。若改用 Stalwart 自带 ACME，指向其证书文件即可
    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全响应头 ----------
    # CSP 说明：
    #   frame-src 允许前端用 srcdoc/blob 渲染隔离的邮件正文
    #   img-src 中的 https: 用于「用户手动放行外部图片」；若要彻底禁止追踪像素，
    #   删掉 https: 并改由 /img-proxy 转发（当前未实现，保持默认更实用）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- 前端静态文件 ----------
    root /var/www/mail/current;
    index index.html;

    client_max_body_size 50m;

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------- JMAP 反代 ----------
    # Stalwart v1 的邮件 API 与管理 API 都是 /jmap/
    # Host / SNI / 证书名必须与 Stalwart 的 hostname 一致，
    # 否则会报 Client metadata documents are disabled
    location = /.well-known/jmap {
        proxy_pass https://127.0.0.1:443;
        include /etc/nginx/snippets/stalwart-proxy.conf;
    }

    location /jmap/ {
        proxy_pass https://127.0.0.1:443;
        include /etc/nginx/snippets/stalwart-proxy.conf;
    }

    # 邮件客户端自动配置（Thunderbird / Outlook 探测用）
    location /.well-known/autoconfig/ {
        proxy_pass https://127.0.0.1:443;
        include /etc/nginx/snippets/stalwart-proxy.conf;
    }

    location /autoconfig/ {
        proxy_pass https://127.0.0.1:443;
        include /etc/nginx/snippets/stalwart-proxy.conf;
    }

    location /autodiscover/ {
        proxy_pass https://127.0.0.1:443;
        include /etc/nginx/snippets/stalwart-proxy.conf;
    }

    location = /.well-known/mta-sts.txt {
        proxy_pass https://127.0.0.1:443;
        include /etc/nginx/snippets/stalwart-proxy.conf;
    }

    # 注意：不要反代 /admin 与 /account。
    # 前端自己占了 /admin 路由，且 Stalwart WebUI 不应暴露公网。
    # 需要时用 SSH 隧道：ssh -L 8443:127.0.0.1:443 user@server
    # 然后访问 https://127.0.0.1:8443/admin
}
